[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tourism-disambiguation"
version = "0.1.0"
description = "Grounded dual-target tourism recommendation and decision-valued elicitation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
[project.optional-dependencies]
llm = ["torch>=2.6", "transformers>=4.45,<5", "accelerate>=1.0", "huggingface-hub>=0.26"]
plots = ["matplotlib>=3.7"]
[project.scripts]
tourism = "tourism.cli:main"
[tool.setuptools.packages.find]
include = ["tourism*"]
